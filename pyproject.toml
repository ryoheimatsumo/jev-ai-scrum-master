[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-ai-scrum-master"
version = "0.1.0a3"
description = "Skill-first evidence-driven development with a CLI core and optional Jev/MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Jev AI Scrum Master contributors"}]
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
jev = ["typesafe-sdk"]
dev = ["pytest>=8,<10", "pytest-cov>=5", "ruff>=0.11", "build>=1"]

[project.scripts]
jev-sm = "jev_sm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["sdk: requires optional official SDK", "live: requires explicit paid API opt-in"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
jev_sm = ["assets/skills/jev-scrum-master/SKILL.md", "assets/skills/jev-scrum-master/references/*.md", "assets/skills/jev-scrum-master/assets/*.json", "assets/skills/jev-scrum-master/agents/*.yaml", "assets/skills/jev-scrum-master/scripts/*.py", "assets/skills/jev-scrum-master/assets/*.txt"]
