name: Tests
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src tests
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/sync_skill_assets.py --check
      - run: python scripts/validate_distribution.py
      - run: python scripts/demo.py --simulate-approvals
      - run: python scripts/demo_cli.py --simulate-approvals
  sdk-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,mcp,jev]'
      - run: python -m pytest -q -m 'sdk and not live'
      - run: python -m build
# No API credentials, secrets, automatic publishing, pull_request_target, or deployment.
# This is a proposed CI workflow; it has not run on GitHub until the repo is published.
